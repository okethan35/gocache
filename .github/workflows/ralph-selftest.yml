name: ralph-selftest

# Unit tests for the guard itself, run against the PR's own copy.
# Plain pull_request: no secrets and a read-only token, like ci.yml.

on:
  pull_request:
    paths: [".claude/**", ".github/workflows/ralph-*.yml"]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - run: python -m unittest discover -s .claude/ralph/tests -v
      - run: python .claude/ralph/guard.py lint
