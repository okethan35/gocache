name: ralph-on-merge

# When a PR merges, issues it was blocking may now be eligible. Start one
# writer run with no payload; it picks the oldest eligible ralph-loop issue.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  fire-writer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Fire writer routine
        env:
          FIRE_TOKEN: ${{ secrets.RALPH_WRITER_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_TOKEN" ]; then
            echo "RALPH_WRITER_FIRE_TOKEN not set; skipping."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            https://api.anthropic.com/v1/claude_code/routines/trig_013SJZmeYLqepkXVjWkvUp2x/fire \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H 'anthropic-version: 2026-10-21' \
            -H 'Content-Type: application/json' \
            -d '{}' -o /dev/null -w 'HTTP %{http_code}\n'
