name: ralph-guard

# Ralph Loop spec rules 17-19. Runs from the base branch's copy of this workflow
# (pull_request_target), so a PR cannot change the check that judges it.
# It checks out the default branch only and reads the PR through the API; PR code never runs here.
# A PR into any other branch fails (rule 17), so a branch's own copy of the guard never counts.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited] # edited: a changed base branch is judged again

permissions:
  contents: read
  pull-requests: read

jobs:
  ralph-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # no ref: pull_request_target checks out the default branch, never the PR or its base
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Check the PR
        run: python .claude/ralph/guard.py pr
        env:
          GH_TOKEN: ${{ github.token }}
