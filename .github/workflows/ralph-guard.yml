name: ralph-guard

# Ralph Loop spec rules 17-19. Runs from the base branch's copy of this workflow
# (pull_request_target), so a PR cannot change the check that judges it.
# It checks out the BASE commit only and reads the PR through the API; PR code never runs here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  ralph-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Check the PR
        run: python .claude/ralph/guard.py pr
        env:
          GH_TOKEN: ${{ github.token }}
