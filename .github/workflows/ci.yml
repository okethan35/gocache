name: ci

# Project CI. The Ralph Loop needs two things from it (SETUP.md): the workflow is named
# `ci` (the router's workflow_run waits for it) and the job is named config.ci_check (`test`).
# Only the steps under `test` are language-specific.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
# red-team probe
